name: Actualizar FQDN Maliciosos (Threat Intel)

on:
  schedule:
    # Ejecuta cada hora en el minuto 43 para evitar colas en GitHub
    - cron: '43 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-fqdn:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v5

      - name: Descargar y validar FQDNs maliciosos
        run: |
          HTTP_CODE=$(curl -sS -L -w "%{http_code}" -o temp_domains.txt \
            --retry 3 --retry-delay 5 --max-time 30 --max-filesize 15728640 \
            https://raw.githubusercontent.com/hagezi/dns-blocklists/main/domains/tif.mini.txt)

          if [ "$HTTP_CODE" -ne 200 ]; then
            echo "ERROR: La descarga falló con código HTTP $HTTP_CODE"
            exit 1
          fi

          python3 - << 'EOF'
          import ipaddress
          import re
          import sys

          # Regex estricta para FQDN válido (RFC 1123)
          FQDN_REGEX = re.compile(
              r"^(?!-)[a-z0-9-]{1,63}(?<!-)(\.(?!-)[a-z0-9-]{1,63}(?<!-))*\.[a-z]{2,24}$"
          )

          # Dominios legítimos/nube que jamás deben bloquearse
          DOMINIOS_PROTEGIDOS = (
              "fortinet.com", "fortiguard.net", "github.com", "githubusercontent.com",
              "microsoft.com", "windowsupdate.com", "office.com", "live.com",
              "google.com", "googleapis.com", "gstatic.com", "apple.com", "icloud.com",
              "amazon.com", "amazonaws.com", "cloudflare.com", "akamai.net",
              "dropbox.com", "discord.com", "discordapp.com"
          )

          dominios_validos = set()

          with open("temp_domains.txt", "r", encoding="utf-8", errors="ignore") as f:
              for linea in f:
                  candidato = linea.strip().split("#")[0].strip().lower().rstrip(".")
                  if not candidato or len(candidato) > 253:
                      continue

                  # Descartar si es una dirección IP
                  try:
                      ipaddress.ip_address(candidato)
                      continue
                  except ValueError:
                      pass

                  # Validar formato estricto de FQDN
                  if not FQDN_REGEX.match(candidato):
                      continue

                  # Proteger infraestructura crítica y plataformas en la nube
                  if any(candidato == d or candidato.endswith("." + d) for d in DOMINIOS_PROTEGIDOS):
                      continue

                  dominios_validos.add(candidato)

          # Umbral mínimo de seguridad
          if len(dominios_validos) < 50:
              print(f"ERROR: Solo se encontraron {len(dominios_validos)} dominios. Se aborta para proteger la lista actual.")
              sys.exit(1)

          lista_ordenada = sorted(dominios_validos)[:100000]

          with open("fqdn_maliciosos.txt", "w", encoding="ascii") as out:
              out.write("\n".join(lista_ordenada) + "\n")

          print(f"Éxito: {len(lista_ordenada)} FQDNs maliciosos validados y guardados.")
          EOF
          rm -f temp_domains.txt

      - name: Guardar cambios
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add fqdn_maliciosos.txt
          git diff --quiet && git diff --staged --quiet || (git commit -m "Actualización FQDN Threat Intel" && git push)
