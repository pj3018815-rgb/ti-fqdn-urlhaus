name: Actualizar FQDN Maliciosos (URLhaus)

on:
  schedule:
    # Ejecuta cada hora en el minuto 43 para evitar colas en GitHub
    - cron: '43 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-fqdn:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Descargar y validar FQDNs maliciosos
        run: |
          curl -sS --fail --retry 3 --retry-delay 5 --max-time 30 --max-filesize 15728640 \
            https://urlhaus.abuse.ch/downloads/hostfile/ > temp_hosts.txt

          python3 - << 'EOF'
          import re
          import sys

          # Regex estricta para FQDN válido (RFC 1123): solo letras, números, guiones y puntos; sin rutas ni puertos
          FQDN_REGEX = re.compile(
              r"^(?!-)[a-z0-9-]{1,63}(?<!-)(\.(?!-)[a-z0-9-]{1,63}(?<!-))*\.[a-z]{2,24}$"
          )

          # Dominios de infraestructura crítica que jamás deben bloquearse
          DOMINIOS_PROTEGIDOS = (
              "fortinet.com", "fortiguard.net", "github.com", "githubusercontent.com",
              "microsoft.com", "windowsupdate.com", "office.com", "google.com",
              "googleapis.com", "gstatic.com", "apple.com", "icloud.com",
              "amazon.com", "amazonaws.com", "cloudflare.com", "akamai.net"
          )

          dominios_validos = set()

          with open("temp_hosts.txt", "r", encoding="utf-8", errors="ignore") as f:
              for linea in f:
                  # Eliminar comentarios y espacios
                  limpia = linea.strip().split("#")[0].strip().lower()
                  if not limpia:
                      continue

                  # Extraer el dominio (soporta formato "127.0.0.1 dominio.com" o "dominio.com")
                  partes = limpia.split()
                  candidato = partes[1] if len(partes) >= 2 and partes[0] in ("127.0.0.1", "0.0.0.0") else partes[0]

                  # Quitar punto final si existe y validar longitud máxima DNS (253 caracteres)
                  candidato = candidato.rstrip(".")
                  if len(candidato) > 253 or not FQDN_REGEX.match(candidato):
                      continue

                  # Evitar bloquear infraestructura crítica o sus subdominios
                  if any(candidato == d or candidato.endswith("." + d) for d in DOMINIOS_PROTEGIDOS):
                      continue

                  dominios_validos.add(candidato)

          # Umbral mínimo de seguridad: evita sobrescribir si la fuente vino vacía o rota
          if len(dominios_validos) < 50:
              print(f"ERROR: Solo se encontraron {len(dominios_validos)} dominios. Se aborta para proteger la lista actual.")
              sys.exit(1)

          lista_ordenada = sorted(dominios_validos)[:100000]

          with open("fqdn_maliciosos.txt", "w", encoding="ascii") as out:
              out.write("\n".join(lista_ordenada) + "\n")

          print(f"Éxito: {len(lista_ordenada)} FQDNs maliciosos validados y guardados.")
          EOF
          rm -f temp_hosts.txt

      - name: Guardar cambios
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add fqdn_maliciosos.txt
          git diff --quiet && git diff --staged --quiet || (git commit -m "Actualización FQDN URLhaus" && git push)
